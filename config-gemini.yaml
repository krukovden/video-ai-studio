# Production config with the video-capable analyst switched on.
#
# Everything except `analyze` stays on the subscription-backed Claude CLI: the
# metered call is worth it for judging delivery from the footage, and is not
# worth it for naming a section title.
providers:
  asr: parakeet
  llm: claude_cli

llm_by_stage:
  analyze: gemini_api
  describe: gemini_api

# Watch every source clip once and write down what is in it. Cached by file
# identity, so re-editing never re-sends the footage; delete
# work/04c-clip-notes.json to ask for a fresh look.
describe:
  enabled: true

analyze:
  submit_video: true
  video_padding_seconds: 0.6
  max_video_seconds: 900.0
  llm_timeout_seconds: 900

transcribe:
  phrase_gap_seconds: 0.5
  max_words_per_phrase: 30
  cut_padding_seconds: 0.15
  chunk_duration_seconds: 120.0
  overlap_duration_seconds: 15.0

render:
  draft_height: 720
  draft_crf: 23
  audio_fade_seconds: 0.03

plan:
  reject_adult_in_frame: true
  reject_unusable_shots: true

effects:
  enabled: true

polish:
  enabled: true
  strict_contract: true
  require_approval: true
  intro_seconds: 2.5
  outro_seconds: 2.5
  outro_text: "Thanks for watching!"
  title_seconds: 2.0
  captions_enabled: true
  burn_captions: false
  caption_words: 4
  music_gain_db: -22.0
  music_duck_db: -12.0
  transition_frames: 8
  music_dir: assets/Music
  output_height: 1080
  output_crf: 18
  hardware_encode: true
