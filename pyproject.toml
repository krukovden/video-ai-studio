[project]
name = "videoai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "parakeet-mlx>=0.5.2",
    "pydantic>=2.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "typer>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
videoai = "videoai.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoai"]
