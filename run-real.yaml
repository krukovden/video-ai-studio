providers:
  asr: parakeet
  llm: claude_cli
transcribe:
  phrase_gap_seconds: 0.5
  max_words_per_phrase: 30
  cut_padding_seconds: 0.15
analyze:
  keyframes_per_phrase: 1
  insert_max_words_per_second: 0.5
  llm_model: sonnet
  llm_timeout_seconds: 1800
render:
  draft_height: 540
  draft_crf: 26
  audio_fade_seconds: 0.03
sync:
  primary_camera:
plan:
  exclude_phrases:
    - clip-04#002        # an adult walks in front of the camera during this shot
  gain_db_by_beat: {}
  reject_adult_in_frame: true
  reject_unusable_shots: true

polish:
  # There is one delivery renderer and production-contract.yaml always applies to
  # it; enabled: false would copy the review draft out as preview-fallback.mp4.
  enabled: true
  # This file is the operator's re-render command, not the creator's workflow.
  # `videoai produce` is the approval-bound path; keep this false so a rules or
  # code change can be re-rendered without asking the creator to re-review an
  # identical draft.
  require_approval: false
  captions_enabled: true
  burn_captions: false
  music_dir: assets/Music
  output_height: 1080     # 1920x1080, as production-contract.yaml requires
  output_crf: 18
  hardware_encode: true
