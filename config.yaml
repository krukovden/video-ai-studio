# Provider selection per stage. Switching a value re-runs only the affected
# stages (fingerprints include the provider name).
providers:
  asr: parakeet      # parakeet | mock
  llm: claude_cli    # claude_cli | mock

transcribe:
  phrase_gap_seconds: 0.5
  max_words_per_phrase: 30
  cut_padding_seconds: 0.15
  # Long clips are chunked so parakeet-mlx stays inside the GPU's unified-memory
  # buffer limit instead of allocating the whole file as one buffer.
  chunk_duration_seconds: 120.0
  overlap_duration_seconds: 15.0

analyze:
  keyframes_per_phrase: 1
  llm_model: sonnet
  llm_timeout_seconds: 600

render:
  draft_height: 720
  draft_crf: 23
  audio_fade_seconds: 0.03

sync:
  primary_camera:    # leave empty to detect the camera with the real microphone

plan:
  exclude_phrases: []   # phrase ids to ban outright, e.g. clip-03#012
  gain_db_by_beat: {}   # beat name -> gain in dB, e.g. {Popping: -6}
