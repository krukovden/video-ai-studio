# Provider selection per stage. Switching a value re-runs only the affected
# stages (fingerprints include the provider name).
providers:
  asr: parakeet      # parakeet | mock
  llm: claude_cli    # claude_cli | mock

transcribe:
  phrase_gap_seconds: 0.5
  max_words_per_phrase: 30
  cut_padding_seconds: 0.15
  # Long clips are chunked so parakeet-mlx stays inside the GPU's unified-memory
  # buffer limit instead of allocating the whole file as one buffer.
  chunk_duration_seconds: 120.0
  overlap_duration_seconds: 15.0

analyze:
  keyframes_per_phrase: 1
  llm_model: sonnet
  llm_timeout_seconds: 600
  # Clips quieter than this (words per second) are offered to the planner as
  # silent visual inserts. A clip with no words at all always qualifies.
  insert_max_words_per_second: 0.5

render:
  draft_height: 720
  draft_crf: 23
  audio_fade_seconds: 0.03

sync:
  primary_camera:    # leave empty to detect the camera with the real microphone

plan:
  exclude_phrases: []   # phrase ids to ban outright, e.g. clip-03#012
  gain_db_by_beat: {}   # beat name -> gain in dB, e.g. {Popping: -6}
  # The visual gate over the segments the planner chose: refuse the draft when a
  # selected shot has an adult filling or crossing the frame, or cannot be used
  # at all. Rejected phrases land in work/05c-rejected.json and are withheld from
  # every later planning round.
  reject_adult_in_frame: true
  reject_unusable_shots: true

polish:
  enabled: true
  intro_seconds: 2.5      # the title card, cross-dissolved into the first segment
  title_seconds: 2.0      # how long a beat's lower third stays up
  music_gain_db: -22.0    # where the bed sits before ducking
  music_duck_db: -12.0    # how much further it drops while the child is talking
  transition_frames: 8    # cross-dissolve length, on section boundaries only
  music_track:            # leave empty to choose by style, then by project name
  music_dir: assets/Music
